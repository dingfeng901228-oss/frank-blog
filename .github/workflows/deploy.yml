name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install admin dependencies
        run: cd admin && npm ci

      - name: Build admin SPA
        run: cd admin && npm run build

      - name: Build
        run: npm run build

      - name: Copy admin SPA output
        run: cp -r admin/out out/admin

      - name: Copy index.html
        run: cp out/ja.html out/index.html

      - name: Copy functions
        run: mkdir -p out/functions && cp -r functions out/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: frank-blog-cms
          directory: out