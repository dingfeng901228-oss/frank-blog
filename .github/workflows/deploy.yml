name: Deploy to Cloudflare Pages (split projects)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install admin deps
        run: cd admin && npm ci

      - name: Build admin SPA
        run: cd admin && npm run build

      - name: Build main site (blog)
        run: npm run build

      - name: Copy ja.html → out/index.html (blog fallback)
        run: cp out/ja.html out/index.html

      # ────── ADMIN deploy (frank-blog-cms project) ──────
      # Pages now ONLY hosts the admin SPA static files.
      # /api/admin/* moved to worker-api (independent Worker).
      - name: Prepare admin-only dir
        run: |
          rm -rf out-admin
          mkdir -p out-admin
          cp -r admin/out/. out-admin/
          # /api/admin/* moved to worker-api (independent Worker).
          # Pages no longer hosts any /api/* endpoints (avoids the
          # wrangler 3.x pages-deploy [[d1_databases]] bug entirely).
          printf '/  /admin/  302\n' > out-admin/_redirects

      - name: Deploy admin to frank-blog-cms
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: frank-blog-cms
          directory: out-admin
          wranglerVersion: '3'

      # ────── worker-api deploy (Cloudflare Workers) ──────
      # Worker DOES apply [[d1_databases]] from wrangler.toml at deploy time.
      # So env.DB is populated at runtime → /api/admin/auth/* works.
      - name: Install worker-api deps
        run: cd worker-api && npm install --no-audit --prefer-offline --legacy-peer-deps

      - name: Deploy worker-api to Cloudflare Workers
        run: cd worker-api && npx wrangler@4 deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ────── BLOG deploy (frank-blog project) ──────
      - name: Prepare blog-only dir
        run: |
          rm -rf out-blog
          mkdir -p out-blog
          cp -r out/. out-blog/
        # out-blog/ contains: blog pages + ja.html-as-index.html + public/_redirects
        # NO functions/, NO admin SPA, NO D1 binding wrangler.toml would try to add

      - name: Deploy blog to frank-blog
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: frank-blog
          directory: out-blog
          wranglerVersion: '3'
