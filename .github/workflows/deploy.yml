name: Deploy to Cloudflare Pages (split projects)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install admin deps
        run: cd admin && npm ci

      - name: Build admin SPA
        run: cd admin && npm run build

      - name: Build main site (blog)
        run: npm run build

      - name: Copy ja.html → out/index.html (blog fallback)
        run: cp out/ja.html out/index.html

      # ────── ADMIN deploy (frank-blog-cms project) ──────
      - name: Prepare admin-only dir
        run: |
          rm -rf out-admin
          mkdir -p out-admin
          cp -r admin/out/. out-admin/
          mkdir -p out-admin/functions
          cp -r functions out-admin/
          # Fix (2026-09-03): admin SPA is Next.js export rooted at /admin/, no
          # index.html at the project root. Route CMS root to the SPA mount point.
          # (D1 binding is handled via pages_build_output_dir in wrangler.toml —
          #  wrangler rejects wrangler.toml for Pages unless that field matches
          #  the deploy directory. out-admin/ matches → D1 binding applied.)
          printf '/  /admin/  302\n' > out-admin/_redirects
        # public/_redirects (blog's `/ → /ja`) NOT copied — that rule would break
        # CMS root. CMS root is now served by out-admin/_redirects above.

      - name: Deploy admin to frank-blog-cms
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: frank-blog-cms
          directory: out-admin
          wranglerVersion: '4'

      # Fix (2026-09-03): wrangler 3.x pages deploy doesn't apply [[d1_databases]]
      # to the deployment. env.DB stays undefined at Pages Functions runtime →
      # /api/admin/auth/* returns 500. Apply binding to deployment post-deploy.
      # Project-level binding (Dashboard or wrangler.toml) is NOT inherited.
      # First attempt used PUT /deployments/{id}/bindings/d1/DB → 405.
      # Try PATCH /deployments/{id} with deployment_configs body instead.
      - name: Apply D1 binding to latest frank-blog-cms deployment
        if: success()
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          DEPLOY_ID=$(curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/frank-blog-cms" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).result.latest_deployment.id)}catch(e){console.error('PARSE_ERR:',s.slice(0,200));process.exit(1)}})")
          echo "Latest deployment id: $DEPLOY_ID"

          echo "--- PATCH deployment deployment_configs ---"
          HTTP=$(curl -sS -o /tmp/patch.json -w "%{http_code}" -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/frank-blog-cms/deployments/${DEPLOY_ID}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"deployment_configs":{"production":{"d1_databases":{"DB":{"id":"a1dcda23-2b33-4c3b-9eaa-2c0429d35cb1"}}}}}')
          echo "HTTP $HTTP"
          cat /tmp/patch.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(s.slice(0,600)))"

      # ────── BLOG deploy (frank-blog project) ──────
      - name: Prepare blog-only dir
        run: |
          rm -rf out-blog
          mkdir -p out-blog
          cp -r out/. out-blog/
        # out-blog/ contains: blog pages + ja.html-as-index.html + public/_redirects
        # NO functions/, NO admin SPA, NO D1 binding wrangler.toml would try to add

      - name: Deploy blog to frank-blog
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: frank-blog
          directory: out-blog
          wranglerVersion: '3'
