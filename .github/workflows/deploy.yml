name: Deploy to Cloudflare Pages (single project + Worker)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      # ────── Install worker-api deps ──────
      # The admin SPA build and the D1 → MDX sync are NOT listed here: they
      # run inside `npm run build` via the repo's `prebuild` hook
      # (scripts/prebuild.mjs), so GitHub Actions, the Cloudflare Pages deploy
      # hook and a local build all produce an identical, complete output.
      # Keeping the pipeline in the repo is what prevents a builder from
      # silently shipping an admin-less deploy.
      - name: Install worker-api deps
        # --legacy-peer-deps bridges the wrangler@4 / workers-types@5 peer
        # dep gap. wrangler@4.129 ships an esbuild package.json @ 0.28.1 but
        # the platform-specific binary (linux-x64 / win32-x64) is still
        # 0.27.3; the install.js validation kills the postinstall on Linux
        # with "Expected 0.28.1 but got 0.27.3". We pin wrangler to a version
        # (4.128) where esbuild binary and package.json match.
        run: |
          cd worker-api
          npm install wrangler@4.128.0 --save-dev --no-audit --no-fund --prefer-offline --legacy-peer-deps

      - name: Build main site (blog) + admin SPA
        # prebuild → builds admin SPA into admin/out/, then syncs D1 →
        #   src/content/{locale}/{posts,notes}/ (D1 is the source of truth
        #   per ADR-002, so publishing from the CMS changes the rendered site).
        # next build → renders the MDX to static HTML.
        # postbuild → 1. copy-admin-to-out.mjs — src/_admin/ (ADR-003
        #               30-day rollback) into out/_admin/.
        #             2. copy-admin-spa.mjs — admin/out/ into out/admin/ and
        #                merges _next/ chunks. HARD-FAILS if admin/out/ is
        #                missing, so an admin-less deploy cannot ship.
        run: npm run build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Copy ja.html → out/index.html (blog fallback)
        run: cp out/ja.html out/index.html

      # ────── worker-api deploy (Cloudflare Workers) ──────
      # Worker DOES apply [[d1_databases]] from wrangler.toml at deploy time.
      # So env.DB is populated at runtime → /api/admin/auth/* works.
      # (deps were installed earlier — same wrangler package is reused for
      # the deploy command below.)
      #
      # Phase 11: wrangler.toml now declares
      #   [[routes]] pattern = "blog.frank2025.com/api/admin/*"
      # in addition to the existing custom domain on cms.blog.frank2025.com.
      # A successful `wrangler deploy` registers the new route so the
      # browser hitting blog.frank2025.com/api/admin/* lands on this Worker.
      - name: Deploy worker-api to Cloudflare Workers
        run: cd worker-api && npx wrangler@4 deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ────── BLOG + CMS SPA deploy (frank-blog project) ──────
      # Phase 11 collapsed frank-blog-cms into frank-blog: the same Pages
      # project now serves blog.frank2025.com (blog) AND blog.frank2025.com/admin
      # (admin SPA, statically exported). /api/admin/* is served by the
      # Worker via the route declared in wrangler.toml above.
      #
      # out/ contains: blog pages + admin SPA + ja.html-as-index.html +
      #                public/_redirects (including the /admin rewrites).
      #
      # NOTE: this used to be `uses: cloudflare/pages-action@v1`. Cloudflare
      # deprecated and then removed that action from the marketplace, so the
      # whole job started failing at "Set up job" with
      #   Unable to resolve action `cloudflare/pages-action`, not found
      # (before any build ran). `wrangler pages deploy` is the supported
      # replacement and is what a local deploy already uses — one code path.
      - name: Deploy blog + admin SPA to frank-blog
        run: npx wrangler@4 pages deploy out --project-name=frank-blog --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
