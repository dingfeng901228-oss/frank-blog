name: Deploy to Cloudflare Pages (split projects)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install admin deps
        run: cd admin && npm ci

      - name: Build admin SPA
        run: cd admin && npm run build

      - name: Build main site (blog)
        run: npm run build

      - name: Copy ja.html → out/index.html (blog fallback)
        run: cp out/ja.html out/index.html

      # ────── ADMIN deploy (frank-blog-cms project) ──────
      - name: Prepare admin-only dir
        run: |
          rm -rf out-admin
          mkdir -p out-admin
          cp -r admin/out/. out-admin/
          mkdir -p out-admin/functions
          cp -r functions out-admin/
          # Fix (2026-09-03): admin SPA is Next.js export rooted at /admin/, no
          # index.html at the project root. Route CMS root to the SPA mount point.
          # (D1 binding is handled via pages_build_output_dir in wrangler.toml —
          #  wrangler rejects wrangler.toml for Pages unless that field matches
          #  the deploy directory. out-admin/ matches → D1 binding applied.)
          printf '/  /admin/  302\n' > out-admin/_redirects
        # public/_redirects (blog's `/ → /ja`) NOT copied — that rule would break
        # CMS root. CMS root is now served by out-admin/_redirects above.

      - name: Deploy admin to frank-blog-cms
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: frank-blog-cms
          directory: out-admin
          wranglerVersion: '3'

      # ────── BLOG deploy (frank-blog project) ──────
      - name: Prepare blog-only dir
        run: |
          rm -rf out-blog
          mkdir -p out-blog
          cp -r out/. out-blog/
        # out-blog/ contains: blog pages + ja.html-as-index.html + public/_redirects
        # NO functions/, NO admin SPA, NO D1 binding wrangler.toml would try to add

      - name: Deploy blog to frank-blog
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: frank-blog
          directory: out-blog
          wranglerVersion: '3'
