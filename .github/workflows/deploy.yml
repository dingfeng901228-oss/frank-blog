name: Deploy to Cloudflare Pages (single project + Worker)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install admin deps
        run: cd admin && npm ci

      - name: Build admin SPA
        # `next build` writes admin SPA into admin/out/. The root postbuild
        # script (copy-admin-spa.mjs) then merges it into out/admin/ so the
        # main frank-blog Pages project serves /admin/* alongside the blog.
        run: cd admin && npm run build

      # ────── Install worker-api deps + sync D1 → src/content/ MDX ──────
      # Per ADR-002: D1 is the source of truth for posts; SSG rebuilds
      # generate MDX from D1, then next build renders to static HTML.
      # The sync must happen BEFORE 'Build main site' so the rendered
      # blog reflects whatever was last published/unpublished in admin.
      - name: Install worker-api deps
        # --legacy-peer-deps bridges the wrangler@4 / workers-types@5 peer
        # dep gap. wrangler@4.129 ships an esbuild package.json @ 0.28.1 but
        # the platform-specific binary (linux-x64 / win32-x64) is still
        # 0.27.3; the install.js validation kills the postinstall on Linux
        # with "Expected 0.28.1 but got 0.27.3". We pin wrangler to a version
        # (4.128) where esbuild binary and package.json match.
        run: |
          cd worker-api
          npm install wrangler@4.128.0 --save-dev --no-audit --no-fund --prefer-offline --legacy-peer-deps

      - name: Sync D1 → src/content/ (D-6 byte-level preservation)
        # Reads published posts from REMOTE D1 and writes MDX files
        # to src/content/{locale}/{posts,notes}/. next build then reads
        # these MDX files via the existing src/lib/blog.ts (unchanged).
        # Auth via OAuth (Cloudflare API token) for wrangler d1 execute
        # must be set as wrangler secret / .dev.vars OR rely on the same
        # CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID env vars below.
        run: node scripts/sync-d1-to-mdx.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build main site (blog)
        # Triggers postbuild which runs:
        #   1. copy-admin-to-out.mjs — copies src/_admin/ (30-day rollback
        #      per ADR-003) into out/_admin/.
        #   2. copy-admin-spa.mjs    — copies admin/out/ into out/admin/ and
        #      merges _next/ chunks into out/_next/.
        run: npm run build

      - name: Copy ja.html → out/index.html (blog fallback)
        run: cp out/ja.html out/index.html

      # ────── worker-api deploy (Cloudflare Workers) ──────
      # Worker DOES apply [[d1_databases]] from wrangler.toml at deploy time.
      # So env.DB is populated at runtime → /api/admin/auth/* works.
      # (deps were installed earlier — same wrangler package is reused for
      # the deploy command below.)
      #
      # Phase 11: wrangler.toml now declares
      #   [[routes]] pattern = "blog.frank2025.com/api/admin/*"
      # in addition to the existing custom domain on cms.blog.frank2025.com.
      # A successful `wrangler deploy` registers the new route so the
      # browser hitting blog.frank2025.com/api/admin/* lands on this Worker.
      - name: Deploy worker-api to Cloudflare Workers
        run: cd worker-api && npx wrangler@4 deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ────── BLOG + CMS SPA deploy (frank-blog project) ──────
      # Phase 11 collapsed frank-blog-cms into frank-blog: the same Pages
      # project now serves blog.frank2025.com (blog) AND blog.frank2025.com/admin
      # (admin SPA, statically exported). /api/admin/* is served by the
      # Worker via the route declared in wrangler.toml above.
      #
      # out/ contains: blog pages + admin SPA + ja.html-as-index.html +
      #                public/_redirects (including /admin → /admin.html rewrite).
      - name: Deploy blog + admin SPA to frank-blog
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: frank-blog
          directory: out
          wranglerVersion: '3'
