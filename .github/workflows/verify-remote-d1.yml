name: Verify Remote D1

# One-off workflow to check frank-blog-db remote state after manual cleanup + apply.
# Trigger manually via: gh workflow run verify-remote-d1.yml
# Or GitHub UI → Actions → Verify Remote D1 → Run workflow.

"on":
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install wrangler@4 --no-save

      - name: d1_migrations tracking
        env:
          CLOUDFLARE_API_TOKEN: *** secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== applied migrations ==="
          npx wrangler d1 execute frank-blog-db --remote --command="SELECT name FROM d1_migrations ORDER BY id;"

      - name: post_revisions schema
        env:
          CLOUDFLARE_API_TOKEN: *** secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== post_revisions columns ==="
          npx wrangler d1 execute frank-blog-db --remote --command="SELECT name FROM pragma_table_info('post_revisions');"

      - name: all tables
        env:
          CLOUDFLARE_API_TOKEN: *** secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== tables ==="
          npx wrangler d1 execute frank-blog-db --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name;"
