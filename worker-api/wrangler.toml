name = "frank-blog-cms-api"
main = "src/index.ts"
compatibility_date = "2024-09-01"

# D1 binding — Workers DOES apply [[d1_databases]] at deploy time
# (Pages Functions does not, which is why we're moving to a Worker.)
[[d1_databases]]
binding       = "DB"
database_name = "frank-blog-db"
database_id   = "a1dcda23-2b33-4c3b-9eaa-2c0429d35cb1"

# Phase C2b §37 — Rate limit (per-IP 60 req/min + per-user 300 req/min).
# Frank must run once locally to create the KV namespace:
#   wrangler kv namespace create RATE_LIMIT
# Then update `id` below with the returned namespace ID.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_AFTER_KV_NAMESPACE_CREATE"

# Routes — Worker handles /api/admin/* on cms.blog.frank2025.com
# These are appended to any existing custom-domain routes on the Worker.
# Frank sets up the custom domain in CF Dashboard → Workers → frank-blog-cms-api
#   → Settings → Triggers → Add Custom Domain: cms.blog.frank2025.com
# Pattern matches cms.blog.frank2025.com/api/admin/* but the SPA at /admin/*
# (still served by Pages) wins for non-/api paths.

[vars]
ENVIRONMENT = "production"

# Secrets (set via `wrangler secret put <NAME> --project-name=frank-blog-cms-api`):
#   SESSION_SECRET                — 64-char hex; cookie signing / ip hash salt
#   CLOUDFLARE_DEPLOY_HOOK_URL    — triggers Pages SSG rebuild on publish/unpublish
