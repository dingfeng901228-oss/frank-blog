# frank-blog-live — Cloudflare Pages project (blog frontend only)
# Admin SPA (frank-blog-cms) is a separate Pages project in admin/ subdir.
# /api/admin/* lives in frank-blog-cms-api Worker (worker-api/, wrangler@4 deploy).
# This wrangler.toml is Pages-only config for the BLOG frontend (not the admin SPA).

name = "frank-blog"
# main intentionally removed: Pages wrangler.toml forbids `main` (Worker-only).
#   Worker-only code lives in worker-api/ (deployed via wrangler@4 from CI).
compatibility_date = "2024-09-01"  # bumped from 2024-01-01
pages_build_output_dir = "out"  # blog `next build` exports static HTML here (not out-admin)

# D1 binding is intentionally NOT in this file:
#   - Pages projects don't bind D1 directly (only Workers do via [[d1_databases]])
#   - The blog renders pre-built MDX from `out/` (no request-time DB calls)
#   - D1 is only bound in worker-api/wrangler.toml (Worker only, binding="DB")

# ============================================================
# Secrets (D-2: NEVER commit actual values — use `wrangler pages secret put <NAME>`)
# ============================================================
# CLOUDFLARE_DEPLOY_HOOK_URL  — CF Pages Deploy Hook URL (Settings → Builds → Create hook)
#                                用于 CMS 发布文章后触发 SSG rebuild (ADR-002)
# SESSION_SECRET              — 64-char hex, 用于 cookie signing (Phase 3)
#                                生成: openssl rand -hex 64
# ADMIN_PASSWORD              — admin 登录密码 (≥12 chars), scripts/seed-admin.mjs 读取
#                                仅放 .env.local (gitignored), 绝不入库
# [secrets] section intentionally removed: it's a Worker-only construct and
#   Pages rejects it as "Unexpected fields found in top-level field: secrets".
#   Configure secrets via: wrangler pages secret put <NAME> --project-name=frank-blog

[vars]
ENVIRONMENT = "production"